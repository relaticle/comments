name: Changelog

on:
  release:
    types: [released]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Determine target branch
        id: branch
        env:
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          MAJOR=$(echo "$TAG" | sed -E 's/^v?([0-9]+)\..*/\1/')
          BRANCH="${MAJOR}.x"
          if ! git ls-remote --exit-code --heads "https://github.com/$REPO" "$BRANCH" > /dev/null 2>&1; then
            BRANCH="$DEFAULT_BRANCH"
          fi
          echo "name=${BRANCH}" >> "$GITHUB_OUTPUT"

      - name: Checkout code
        # zizmor: ignore[artipacked] git-auto-commit-action pushes the changelog with this credential
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.branch.outputs.name }}

      - name: Update Changelog
        uses: stefanzweifel/changelog-updater-action@a938690fad7edf25368f37e43a1ed1b34303eb36 # v1.12.0
        with:
          latest-version: ${{ github.event.release.name }}
          release-notes: ${{ github.event.release.body }}

      - name: Commit updated CHANGELOG
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          branch: ${{ steps.branch.outputs.name }}
          commit_message: Update CHANGELOG
          file_pattern: CHANGELOG.md
