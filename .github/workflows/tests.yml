name: Tests

on:
  push:
    branches: [1.x]
  pull_request:
    branches: [1.x]
  workflow_call:

permissions:
  contents: read

jobs:
  actions-pinned:
    name: Actions pinned to SHA
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Assert every third-party action is pinned to a full commit SHA
        run: |
          unpinned=$(grep -rhoE '^[[:space:]]*-?[[:space:]]*uses:[[:space:]]*[^[:space:]]+' .github/workflows \
            | sed -E 's/.*uses:[[:space:]]*//' \
            | grep -v '^\./' \
            | grep -vE '@[0-9a-f]{40}$' \
            | sort -u || true)

          if [ -n "$unpinned" ]; then
            echo "Third-party actions must be pinned to a full 40-character commit SHA."
            echo "Unpinned references:"
            echo "$unpinned" | sed 's/^/  /'
            exit 1
          fi

          echo "All third-party action references are pinned to a full commit SHA."

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest]
        php: [8.2, 8.3, 8.4]
        laravel: [12.*, 13.*]
        filament: [4, 5]
        stability: [prefer-stable]
        exclude:
          # Filament 5 pulls Livewire 4 / pest-plugin-livewire 4, which need PHP 8.3+
          - php: 8.2
            filament: 5
          # Laravel 13 needs PHP 8.3+
          - php: 8.2
            laravel: 13.*
        include:
          - laravel: 12.*
            testbench: 10.*
          - laravel: 13.*
            testbench: 11.*

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - F${{ matrix.filament }} - ${{ matrix.stability }} - ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          coverage: xdebug

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" "filament/filament:^${{ matrix.filament }}.0" "filament/notifications:^${{ matrix.filament }}.0" "filament/support:^${{ matrix.filament }}.0" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: List Installed Dependencies
        run: composer show -D

      - name: Execute tests
        run: vendor/bin/pest --ci
